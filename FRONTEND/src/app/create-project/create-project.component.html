<div class="alert alert-secondary" role="alert">
    <h4>Create Project</h4>
    <hr>
    <input type="text" class="form-control mb-2" placeholder="Name" [(ngModel)]="project.name">
    <input type="text" class="form-control mb-2" placeholder="Description" [(ngModel)]="project.description">
    <button class="btn btn-success" (click)="create()">Create and save</button>
    <div id="liveAlertPlaceholder"></div>
</div>
